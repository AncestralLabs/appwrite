apiVersion: v1
kind: ServiceAccount
metadata:
  name: appwrite-sa
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: appwrite-scc
allowHostDirVolumePlugin: true
allowHostIPC: true
allowHostNetwork: true
allowHostPID: true
allowHostPorts: true
allowPrivilegedContainer: true
allowedCapabilities:
  - '*'
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
users:
  - system:serviceaccount:default:appwrite-sa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appwrite-dind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appwrite-dind
  template:
    metadata:
      labels:
        app: appwrite-dind
    spec:
      serviceAccountName: appwrite-sa
      containers:
        - name: dind
          image: docker:dind
          securityContext:
            privileged: true
          args: ["--tls=false"]
          volumeMounts:
            - name: dind-socket
              mountPath: /var/run
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appwrite-main
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appwrite-main
  template:
    metadata:
      labels:
        app: appwrite-main
    spec:
      serviceAccountName: appwrite-sa
      initContainers:
        - name: wait-for-dind
          image: busybox
          command: ['sh', '-c', 'until nc -z appwrite-dind 2375; do echo waiting for dind; sleep 2; done;']
      containers:
        - name: traefik
          image: traefik:2.11
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: dind-socket
              mountPath: /var/run/docker.sock
        - name: appwrite
          image: appwrite/appwrite:latest
          envFrom:
            - configMapRef:
                name: appwrite-config
          ports:
            - containerPort: 9501
              name: appwrite
          volumeMounts:
            - name: appwrite-storage
              mountPath: /storage
      volumes:
        - name: dind-socket
          emptyDir: {}
        - name: appwrite-storage
          persistentVolumeClaim:
            claimName: appwrite-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: appwrite-service
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: https
      port: 8443
      targetPort: 8443
  selector:
    app: appwrite-main
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: appwrite-http
spec:
  port:
    targetPort: http
  to:
    kind: Service
    name: appwrite-service
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: appwrite-https
spec:
  port:
    targetPort: https
  to:
    kind: Service
    name: appwrite-service
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect