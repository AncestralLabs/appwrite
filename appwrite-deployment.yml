---
# Configuración de Seguridad
apiVersion: v1
kind: ServiceAccount
metadata:
  name: appwrite-sa

---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: appwrite-scc
allowHostDirVolumePlugin: true
allowPrivilegedContainer: true
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
users:
  - system:serviceaccount:default:appwrite-sa

---
# Base de Datos MariaDB
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appwrite-mariadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appwrite-mariadb
  template:
    metadata:
      labels:
        app: appwrite-mariadb
    spec:
      serviceAccountName: appwrite-sa
      containers:
        - name: mariadb
          image: mariadb:10.11
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: rootpassword
            - name: MYSQL_DATABASE
              value: appwrite
            - name: MYSQL_USER
              value: appwrite
            - name: MYSQL_PASSWORD
              value: appwrite
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: mariadb-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appwrite-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appwrite-redis
  template:
    metadata:
      labels:
        app: appwrite-redis
    spec:
      serviceAccountName: appwrite-sa
      containers:
        - name: redis
          image: redis:7.2.4-alpine
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
# Docker-in-Docker (DinD)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appwrite-dind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appwrite-dind
  template:
    metadata:
      labels:
        app: appwrite-dind
    spec:
      serviceAccountName: appwrite-sa
      containers:
        - name: dind
          image: docker:dind
          securityContext:
            privileged: true
          args: ["--tls=false"]
          volumeMounts:
            - name: dind-socket
              mountPath: /var/run
      volumes:
        - name: dind-socket
          emptyDir: {}

---
# Appwrite Core
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appwrite-main
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appwrite-main
  template:
    metadata:
      labels:
        app: appwrite-main
    spec:
      serviceAccountName: appwrite-sa
      initContainers:
        - name: wait-for-dependencies
          image: busybox
          command: ['sh', '-c', 'until nc -z appwrite-mariadb 3306 && nc -z appwrite-redis 6379; do echo "Waiting for dependencies..."; sleep 2; done;']
      containers:
        - name: traefik
          image: traefik:2.11
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: dind-socket
              mountPath: /var/run/docker.sock
        - name: appwrite
          image: appwrite/appwrite:latest
          env:
            - name: _APP_ENV
              value: development
            - name: _APP_DB_HOST
              value: appwrite-mariadb
            - name: _APP_DB_PORT
              value: "3306"
            - name: _APP_DB_USER
              value: appwrite
            - name: _APP_DB_PASS
              value: appwrite
            - name: _APP_REDIS_HOST
              value: appwrite-redis
            - name: _APP_REDIS_PORT
              value: "6379"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: appwrite-storage
              mountPath: /storage
            - name: dind-socket
              mountPath: /var/run/docker.sock
      volumes:
        - name: dind-socket
          emptyDir: {}
        - name: appwrite-storage
          persistentVolumeClaim:
            claimName: appwrite-pvc

---
# Volumen para Appwrite
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: appwrite-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# Workers
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appwrite-workers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appwrite-workers
  template:
    metadata:
      labels:
        app: appwrite-workers
    spec:
      serviceAccountName: appwrite-sa
      containers:
        - name: worker-audits
          image: appwrite/appwrite:latest
          command: ["worker-audits"]
          envFrom:
            - configMapRef:
                name: appwrite-env

        - name: worker-webhooks
          image: appwrite/appwrite:latest
          command: ["worker-webhooks"]
          envFrom:
            - configMapRef:
                name: appwrite-env

      # Agregar más workers según necesidad

---
# OpenRuntimes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appwrite-openruntimes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appwrite-openruntimes
  template:
    metadata:
      labels:
        app: appwrite-openruntimes
    spec:
      serviceAccountName: appwrite-sa
      containers:
        - name: executor
          image: openruntimes/executor:0.6.11
          volumeMounts:
            - name: dind-socket
              mountPath: /var/run/docker.sock
        - name: proxy
          image: openruntimes/proxy:0.5.5
      volumes:
        - name: dind-socket
          emptyDir: {}

---
# Servicios
apiVersion: v1
kind: Service
metadata:
  name: appwrite-service
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: https
      port: 8443
      targetPort: 8443
  selector:
    app: appwrite-main

---
# Configuración de Rutas
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: appwrite-http
spec:
  port:
    targetPort: http
  to:
    kind: Service
    name: appwrite-service

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: appwrite-https
spec:
  port:
    targetPort: https
  to:
    kind: Service
    name: appwrite-service
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

---
# ConfigMap para variables compartidas
apiVersion: v1
kind: ConfigMap
metadata:
  name: appwrite-env
data:
  _APP_ENV: "development"
  _APP_DB_HOST: "appwrite-mariadb"
  _APP_DB_PORT: "3306"
  _APP_DB_USER: "appwrite"
  _APP_DB_PASS: "appwrite"
  _APP_REDIS_HOST: "appwrite-redis"
  _APP_REDIS_PORT: "6379"